[default]
provider = "ollama"
base_url = "http://localhost:11434"
primary_model = "gpt-oss:20b"
secondary_model = "qwen2.5:7b"
review_model = "gpt-oss:20b"
secondary_review_model = "qwen3:14b"
minimum_review_context_tokens = 32768
preferred_review_context_tokens = 131072
forbid_secondary_model_for_reviews = true
allow_secondary_review_model_for_short_reviews = true

[hardware.local]
system_ram_gb = 32
gpu = "Radeon RX 580 Series"
gpu_vram_gb = 4
notes = "Prefer CPU/RAM-friendly quantized models. Do not assume large GPU offload."

[install_policy]
auto_install_models = false
require_user_approval = true
minimum_free_disk_gb = 25
review_model_minimum_context_tokens = 32768
review_model_preferred_context_tokens = 131072
review_model_requires_thinking = true
block_if_model_does_not_fit = true

[[candidate_models]]
name = "qwen3:14b"
role = "secondary_review_short_chapters"
status = "installed"
size_gb = 9.3
context_tokens = 40960
has_thinking = true
allowed_for_reviews = true
review_limit = "short_chapters_only"

[[candidate_models]]
name = "mistral-small3.2:24b"
role = "optional_instruction_following_review_candidate"
status = "installed_but_not_runtime_approved"
size_gb = 15
context_tokens = 131072
has_thinking = false
allowed_for_reviews = false
review_limit = "minimal local run timed out after 180 seconds on CPU"

[model_health."gpt-oss:20b"]
approved_for_runtime = false
reason = "Re-pulled successfully on 2026-05-31 and minimal run works, but reading_sample_review benchmark timed out after 300 seconds on local CPU."

[model_health."qwen3:14b"]
approved_for_runtime = false
reason = "Local reading_sample_review benchmark timed out after 120/180 seconds on 2026-05-31 and after 240 seconds with compact prompt plus think=false on 2026-06-01."

[model_health."mistral-small3.2:24b"]
approved_for_runtime = false
reason = "Installed on 2026-05-31, but even minimal local run timed out after 180 seconds on CPU."

[model_health."qwen2.5:7b"]
approved_for_runtime = true
reason = "Local smoke test completed, but minimal OK run took about 71 seconds on 2026-06-01 and model remains forbidden for review tasks."

[[candidate_models]]
name = "qwen3:30b"
role = "optional_long_context_candidate"
status = "not_installed"
size_gb = 19
context_tokens = 262144
has_thinking = true
allowed_for_reviews = "candidate_after_hardware_test"
review_limit = "may be slow on 32GB RAM and 4GB VRAM"

[tasks.orchestration]
model = "gpt-oss:20b"
reasoning_effort = "high"
temperature = 0.2
requires_structured_output = true

[tasks.interview_analysis]
model = "gpt-oss:20b"
reasoning_effort = "medium"
temperature = 0.2
requires_structured_output = true

[tasks.book_concept]
model = "gpt-oss:20b"
reasoning_effort = "high"
temperature = 0.4
requires_structured_output = true

[tasks.outline]
model = "gpt-oss:20b"
reasoning_effort = "high"
temperature = 0.35
requires_structured_output = true

[tasks.chapter_briefing]
model = "gpt-oss:20b"
reasoning_effort = "medium"
temperature = 0.3
requires_structured_output = true

[tasks.brainstorming]
model = "gpt-oss:20b"
reasoning_effort = "high"
temperature = 0.7
requires_structured_output = true

[tasks.character_development]
model = "gpt-oss:20b"
reasoning_effort = "high"
temperature = 0.55
requires_structured_output = true

[tasks.plotting]
model = "gpt-oss:20b"
reasoning_effort = "high"
temperature = 0.45
requires_structured_output = true

[tasks.treatment]
model = "gpt-oss:20b"
reasoning_effort = "high"
temperature = 0.45
requires_structured_output = true

[tasks.research_scraping]
model = "gpt-oss:20b"
reasoning_effort = "medium"
temperature = 0.2
requires_structured_output = true
requires_approved_market_data = true

[tasks.short_draft]
model = "qwen2.5:7b"
reasoning_effort = "low"
temperature = 0.7
requires_structured_output = false

[tasks.long_draft]
model = "gpt-oss:20b"
reasoning_effort = "medium"
temperature = 0.65
requires_structured_output = false

[tasks.editing]
model = "gpt-oss:20b"
reasoning_effort = "high"
temperature = 0.25
requires_structured_output = true
minimum_context_tokens = 32768
preferred_context_tokens = 131072
requires_thinking = true
allow_secondary_model = false
long_text_strategy = "chapter_scope_then_global_summary"

[tasks.reading_sample_review]
model = "gpt-oss:20b"
alternative_model = "qwen3:14b"
reasoning_effort = "high"
temperature = 0.2
requires_structured_output = true
max_output_tokens = 768
minimum_context_tokens = 32768
preferred_context_tokens = 131072
requires_thinking = true
allow_secondary_model = false
allow_secondary_review_model = true
secondary_review_max_input_tokens = 12000
long_text_strategy = "single_chapter_full_context_compact_findings"

[tasks.consistency_review]
model = "gpt-oss:20b"
reasoning_effort = "high"
temperature = 0.2
requires_structured_output = true
minimum_context_tokens = 65536
preferred_context_tokens = 131072
requires_thinking = true
allow_secondary_model = false
long_text_strategy = "approved_chapter_summaries_plus_targeted_full_chapters"

[tasks.market_assessment]
model = "gpt-oss:20b"
reasoning_effort = "high"
temperature = 0.3
requires_structured_output = true
requires_approved_market_data = true

[tasks.publisher_offer]
model = "gpt-oss:20b"
reasoning_effort = "medium"
temperature = 0.45
requires_structured_output = true

[tasks.kdp_preparation]
model = "gpt-oss:20b"
reasoning_effort = "medium"
temperature = 0.2
requires_structured_output = true
requires_final_approval = true
