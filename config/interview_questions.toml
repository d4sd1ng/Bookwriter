[_meta]
version = "0.1"
status = "pending_review"
requires_approval_before_production = true

[[questions]]
field = "topic"
label = "Thema"
prompt = "Wie lautet das Thema des Buchs?"
required = true
stage = "project_basis"

[[questions]]
field = "book_type"
label = "Buchtyp"
prompt = "Welcher Buchtyp soll entstehen?"
required = true
stage = "project_basis"

[[questions]]
field = "target_audience"
label = "Zielgruppe"
prompt = "Wer ist die primaere Zielgruppe?"
required = true
stage = "target_audience"
blocks_if_missing = true

[[questions]]
field = "reader_problem"
label = "Leserproblem"
prompt = "Welches konkrete Problem hat diese Zielgruppe?"
required = true
stage = "target_audience"

[[questions]]
field = "desired_result"
label = "Leserergebnis"
prompt = "Was soll die Zielgruppe nach dem Lesen koennen, wissen oder entscheiden?"
required = true
stage = "target_audience"

[[questions]]
field = "value_proposition"
label = "Nutzenversprechen"
prompt = "Welchen klaren Nutzen liefert das Buch?"
required = true
stage = "value_proposition"

[[questions]]
field = "tone"
label = "Tonalitaet"
prompt = "Soll der Stil sachlich, beratend, direkt oder erzaehlerisch sein?"
required = true
stage = "style"

[[questions]]
field = "length_goal"
label = "Umfangsziel"
prompt = "Welcher Umfang ist geplant?"
required = true
stage = "structure"

[[questions]]
field = "export_format"
label = "Exportformat"
prompt = "Welches Exportformat ist zuerst relevant?"
required = true
stage = "export"

[[questions]]
field = "sales_goal"
label = "Verkaufsziel"
prompt = "Soll eine Verkaufschancenbewertung, ein Verlagsangebot oder KDP vorbereitet werden?"
required = false
stage = "market"

[[questions]]
field = "start_mode"
label = "Startmodus"
prompt = "Startet das Projekt mit eigener Idee, vorhandenem Text, konkreter Vorgabe oder Brainstorming?"
required = true
stage = "development_foundation"

[[questions]]
field = "selected_idea"
label = "Ausgewaehlte Idee"
prompt = "Welche Idee ist nach Vorgabe oder 5-3-1-Brainstorming ausgewaehlt?"
required = true
stage = "development_foundation"

[[questions]]
field = "book_category"
label = "Buchart"
prompt = "Ist es Belletristik, Sachbuch, Fachbuch, Kinderbuch, Jugendbuch oder Young Adult?"
required = true
stage = "development_foundation"

[[questions]]
field = "age_group"
label = "Altersgruppe"
prompt = "Welche Alters- und Zielgruppe gilt?"
required = true
stage = "development_foundation"

[[questions]]
field = "narrative_focus"
label = "Erzaehlfokus"
prompt = "Ist das Buch handlungsorientiert, charakterorientiert oder beides?"
required = true
stage = "development_foundation"

[[questions]]
field = "perspective"
label = "Perspektive"
prompt = "Wird aus Ich-Perspektive, dritter Person oder anders erzaehlt?"
required = true
stage = "development_foundation"

[[questions]]
field = "perspective_count"
label = "Perspektivenzahl"
prompt = "Gibt es eine oder mehrere Erzaehlperspektiven?"
required = true
stage = "development_foundation"

[[questions]]
field = "ending_type"
label = "Ende"
prompt = "Hat das Buch ein Happy End, offenes Ende, bittersuesses Ende oder anderes Ende?"
required = true
stage = "development_foundation"

[[questions]]
field = "publication_format"
label = "Ausgabeform"
prompt = "Welche Ausgabeform ist geplant: Hardcover, Softcover, Broschur, E-Book oder Taschenbuch?"
required = true
stage = "development_foundation"

[[questions]]
field = "character_mode"
label = "Figurenstatus"
prompt = "Gibt es Figurenvorgaben oder sollen Figuren entwickelt werden?"
required = true
stage = "development_foundation"

[[questions]]
field = "research_mode"
label = "Recherchemodus"
prompt = "Soll ohne Recherche, mit manueller Recherche oder mit freigegebenem Scraping gearbeitet werden?"
required = true
stage = "development_foundation"
